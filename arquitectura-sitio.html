<title>Arquitectura Fernando SEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">

<style>
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --ink:#131C26; --ink-2:#44566A; --muted:#6D8095;
  --rule:#D5DEE6;
  --accent:#15597F;
  --good:#2F8A63; --good-2:#DCEFE5;
  --thin:#C08419; --thin-2:#F8EDD8;
  --bad:#B0463B;  --bad-2:#F8E2DF;
  --shadow:0 1px 2px rgba(19,28,38,.05),0 8px 24px rgba(19,28,38,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1219; --card:#151F2A; --ink:#E7EEF4; --ink-2:#B3C3D2; --muted:#8397AA;
    --rule:#243240;
    --accent:#6FADD4;
    --good:#6CC49B; --good-2:#163024;
    --thin:#DCA950; --thin-2:#2F2616;
    --bad:#E38076;  --bad-2:#331C19;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1219; --card:#151F2A; --ink:#E7EEF4; --ink-2:#B3C3D2; --muted:#8397AA;
  --rule:#243240;
  --accent:#6FADD4;
  --good:#6CC49B; --good-2:#163024;
  --thin:#DCA950; --thin-2:#2F2616;
  --bad:#E38076;  --bad-2:#331C19;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:Barlow,system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1060px; margin:0 auto; padding:36px 20px 80px; display:flex; flex-direction:column; gap:44px}
h1,h2{font-family:"Barlow Condensed",Barlow,sans-serif; margin:0; text-wrap:balance; letter-spacing:.01em}
h1{font-size:clamp(34px,6vw,52px); font-weight:700; line-height:1}
h2{font-size:26px; font-weight:600}
.mono{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.eyebrow{font-family:"Barlow Condensed",sans-serif; font-weight:600; text-transform:uppercase;
  letter-spacing:.16em; font-size:12px; color:var(--muted); margin:0}

/* ---------- portada ---------- */
.hero{display:flex; flex-wrap:wrap; gap:28px; align-items:center; justify-content:space-between}
.score{display:flex; align-items:center; gap:18px}
.ring{width:112px; height:112px; flex:none}
.score-t .n{font-family:"Barlow Condensed",sans-serif; font-size:44px; font-weight:700; line-height:1;
  font-variant-numeric:tabular-nums}
.score-t p{margin:2px 0 0; color:var(--muted); font-size:14px; max-width:26ch}

/* ---------- listas ---------- */
.grupos{display:grid; grid-template-columns:1fr 1fr; gap:34px; align-items:start}
@media (max-width:760px){.grupos{grid-template-columns:1fr; gap:30px}}

.grupo h2{display:flex; align-items:baseline; gap:10px; margin-bottom:12px;
  padding-bottom:9px; border-bottom:2px solid var(--ink)}
.grupo h2 span{font-family:"IBM Plex Mono",monospace; font-size:14px; font-weight:500; color:var(--muted)}
.lista{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}

.fila{display:grid; grid-template-columns:6px 1fr auto; gap:12px; align-items:center; width:100%;
  background:var(--card); border:0; border-radius:8px; padding:12px 14px; cursor:pointer;
  text-align:left; color:inherit; font:inherit; box-shadow:var(--shadow); transition:transform .12s ease}
.fila:hover{transform:translateX(3px)}
.fila:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.fila[aria-pressed="true"]{outline:3px solid var(--accent); outline-offset:2px}
.fila .barra{height:100%; min-height:30px; border-radius:3px; background:var(--muted)}
.fila.good .barra{background:var(--good)}
.fila.thin .barra{background:var(--thin)}
.fila.bad  .barra{background:var(--bad)}
.fila .nom{display:flex; flex-direction:column; gap:2px; min-width:0}
.fila .nom b{font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:17px; line-height:1.15}
.fila .nom span{font-size:12.5px; color:var(--muted); font-family:"IBM Plex Mono",monospace}
.fila .cifra{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--ink-2);
  font-variant-numeric:tabular-nums; white-space:nowrap}
.fila.bad .cifra{color:var(--bad); font-weight:500}
.tag{font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  font-family:"Barlow Condensed",sans-serif; padding:1px 6px; border-radius:99px;
  border:1px solid currentColor; opacity:.85; margin-left:6px}

.legend{display:flex; flex-wrap:wrap; gap:18px; font-size:14px; color:var(--muted)}
.legend b{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:7px; vertical-align:-1px}

/* ---------- detalle ---------- */
.detail{background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:20px 22px;
  display:flex; flex-wrap:wrap; gap:20px 34px; align-items:flex-start}
.detail .main{flex:1 1 260px; min-width:0}
.detail h3{font-family:"Barlow Condensed",sans-serif; font-size:22px; margin:0 0 6px; font-weight:600}
.detail dl{display:grid; grid-template-columns:auto auto; gap:6px 16px; margin:0; font-size:14px}
.detail dt{color:var(--muted)} .detail dd{margin:0; color:var(--ink-2)}
.detail .empty{color:var(--muted); margin:0}

/* ---------- arreglos ---------- */
.fixes{display:grid; grid-template-columns:repeat(auto-fit,minmax(268px,1fr)); gap:14px}
.fix{background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:20px;
  display:flex; flex-direction:column; gap:9px; border-top:5px solid var(--bad)}
.fix.lvl2{border-top-color:var(--thin)} .fix.lvl3{border-top-color:var(--accent)}
.fix .big{font-family:"Barlow Condensed",sans-serif; font-size:40px; font-weight:700; line-height:.95;
  color:var(--bad); font-variant-numeric:tabular-nums}
.fix.lvl2 .big{color:var(--thin)} .fix.lvl3 .big{color:var(--accent)}
.fix h3{font-family:"Barlow Condensed",sans-serif; font-size:19px; margin:0; font-weight:600}
.fix p{margin:0; font-size:14.5px; color:var(--ink-2)}
.fix .who{font-size:13px; color:var(--muted); font-family:"IBM Plex Mono",monospace; line-height:1.7}

.foot{font-size:13.5px; color:var(--muted); text-align:center; max-width:60ch; margin:0 auto}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">

  <header class="hero">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1>Arquitectura<br>del sitio</h1>
    </div>
    <div class="score">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="42" fill="none" stroke="var(--rule)" stroke-width="11"/>
        <circle id="ringFg" cx="50" cy="50" r="42" fill="none" stroke="var(--bad)" stroke-width="11"
                stroke-linecap="round" transform="rotate(-90 50 50)"/>
      </svg>
      <div class="score-t">
        <div class="n" id="scoreN"></div>
        <p id="scoreP"></p>
      </div>
    </div>
  </header>

  <section>
    <div class="grupos">
      <div class="grupo">
        <h2>Páginas <span id="nPag"></span></h2>
        <ul class="lista" id="listaPaginas"></ul>
      </div>
      <div class="grupo">
        <h2>Entradas <span id="nEnt"></span></h2>
        <ul class="lista" id="listaEntradas"></ul>
      </div>
    </div>
    <div class="legend" style="margin-top:20px">
      <span><b style="background:var(--good)"></b>Con cuerpo</span>
      <span><b style="background:var(--thin)"></b>Demasiado corta</span>
      <span><b style="background:var(--bad)"></b>Vacía</span>
    </div>
  </section>

  <section class="detail" id="detail">
    <p class="empty">Pulsa cualquier bloque para ver su ficha.</p>
  </section>

  <section>
    <h2 style="margin-bottom:14px">Arregla esto primero</h2>
    <div class="fixes" id="fixes"></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

const DATA = {"sitio":{"nombre":"Fernando SEO","url":"https://fernandoparraseo.com","wordpress":"6.9.7","tema":"GeneratePress","generado":"2026-08-30 19:41"},"contenido":[{"id":498,"titulo":"A Small & Powerful SEO Company","tipo":"page","estado":"draft","slug":"about","url":"https://fernandoparraseo.com/?page_id=498","parent":0,"fecha":"2021-01-09","modificado":"2026-02-15","palabras":371,"categorias":[],"destacada":false,"editor":"gutenberg","focus_kw":"","metadesc":"","noindex":false},{"id":9,"titulo":"Blog de SEO","tipo":"page","estado":"publish","slug":"blog","url":"https://fernandoparraseo.com/blog/","parent":0,"fecha":"2021-01-05","modificado":"2026-02-14","palabras":0,"categorias":[],"destacada":false,"editor":"gutenberg","focus_kw":"","metadesc":"","noindex":false},{"id":2514,"titulo":"Consultoría SEO Ecommerce","tipo":"page","estado":"publish","slug":"ecommerce","url":"https://fernandoparraseo.com/ecommerce/","parent":0,"fecha":"2026-02-14","modificado":"2026-02-15","palabras":64,"categorias":[],"destacada":false,"editor":"gutenberg","focus_kw":"","metadesc":"","noindex":false},{"id":500,"titulo":"Contactános","tipo":"page","estado":"publish","slug":"contact","url":"https://fernandoparraseo.com/contact/","parent":0,"fecha":"2021-01-09","modificado":"2026-02-14","palabras":18,"categorias":[],"destacada":false,"editor":"gutenberg","focus_kw":"","metadesc":"","noindex":false},{"id":7,"titulo":"Home","tipo":"page","estado":"publish","slug":"home","url":"https://fernandoparraseo.com/","parent":0,"fecha":"2021-01-05","modificado":"2026-02-15","palabras":501,"categorias":[],"destacada":false,"editor":"gutenberg","focus_kw":"consultor seo","metadesc":"Logra los primeros lugares en Google con nuestro servicio de consultor SEO. Análisis profundo y resultados reales para tu empresa.","noindex":false},{"id":16,"titulo":"Inicio","tipo":"page","estado":"publish","slug":"inicio","url":"https://fernandoparraseo.com/inicio/","parent":0,"fecha":"2026-02-14","modificado":"202 const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const C = DATA.contenido, byId = Object.fromEntries(C.map((c) => [c.id, c]));

const entrantes = {}, salientes = {};
C.forEach((c) => { entrantes[c.id] = []; salientes[c.id] = []; });
DATA.enlaces.forEach((e) => { entrantes[e.hacia]?.push(e.desde); salientes[e.desde]?.push(e.hacia); });

const urlsMenu = new Set();
DATA.menus.forEach((m) => m.entradas.forEach((e) => urlsMenu.add(String(e.url).replace(/\/$/, ""))));
const enMenu = (c) => urlsMenu.has(String(c.url).replace(/\/$/, ""));
const pub = (c) => c.estado === "publish";
const salud = (c) => (c.palabras === 0 ? "bad" : c.palabras < 300 ? "thin" : "good");
const huerfana = (c) => entrantes[c.id].length === 0 && !enMenu(c);

/* ---------- portada ---------- */
$("#eyebrow").textContent = DATA.sitio.nombre + " · " + DATA.sitio.url.replace(/^https?:\/\//, "") + " · " + DATA.sitio.generado;

const sanas = C.filter((c) => salud(c) === "good" && !huerfana(c)).length;
const pct = Math.round((sanas / C.length) * 100);
$("#scoreN").textContent = pct + "%";
$("#scoreP").textContent = sanas + " de " + C.length + " piezas están completas y conectadas al resto del sitio.";
const ring = $("#ringFg"), circ = 2 * Math.PI * 42;
ring.style.strokeDasharray = circ;

ring.setAttribute("stroke", pct >= 70 ? "var(--good)" : pct >= 40 ? "var(--thin)" : "var(--bad)");

/* ---------- listas ---------- */
function fila(c) {
  return '<li><button class="fila ' + salud(c) + '" data-id="' + c.id + '" aria-pressed="false">' +

    '<span class="nom"><b>' + esc(c.titulo) + "</b><span>" +
      (pub(c) ? "publicada" : c.estado) + (enMenu(c) ? " · menú" : "") +

    '<span class="cifra">' + (c.palabras === 0 ? "vacía" : c.palabras.toLocaleString("es-CL")) + "</span>" +

const entradas = C.filter((c) => c.tipo === "post").sort((a, b) => b.palabras - a.palabras);

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-id]");
  if (!b) return;
  const c = byId[Number(b.dataset.id)];
  if (!c) return;
  document.querySelectorAll(".fila").forEach((n) =>

  const nom = (arr) => arr.length ? arr.map((i) => esc(byId[i]?.titulo ?? "")).join(" · ") : "ninguno";
  $("#detail").innerHTML =

      "<dt>Imagen destacada</dt><dd>" + (c.destacada ? "sí" : "no") + "</dd>" +

      "<dt>Enlaza a</dt><dd>" + nom(salientes[c.id]) + "</dd>" +

    "</dl>";
  $("#detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
});

/* ---------- arreglos ---------- */
const vacias = C.filter((c) => pub(c) && c.palabras === 0);

const sinSeo = C.filter((c) => !c.focus_kw || !c.metadesc);
const aisladas = C.filter(huerfana);

const fixes = [];
if (vacias.length) fixes.push({ lvl: 1, n: vacias.length, t: "Páginas vacías en vivo",

if (homes.length > 1) fixes.push({ lvl: 1, n: homes.length, t: "Portadas duplicadas",
  d: "Dos páginas de inicio publicadas compitiendo por las mismas búsquedas. Solo una puede ser la portada.", who: homes });
if (pruebas.length) fixes.push({ lvl: 2, n: pruebas.length, t: "Pruebas publicadas",

if (sinSeo.length) fixes.push({ lvl: 2, n: sinSeo.length, t: "Sin datos SEO",

fixes.sort((a, b) => a.lvl - b.lvl);
$("#fixes").innerHTML = fixes.map((f) =>
  '<article class="fix lvl' + f.lvl + '"><div class="big">' + f.n + "</div>" +
  "<h3>" + esc(f.t) + "</h3><p>" + esc(f.d) + "</p>" +
  '<p class="who">' + f.who.slice(0, 6).map((c) => esc(c.titulo)).join("<br>") +
  (f.who.length > 6 ? "<br>+" + (f.who.length - 6) + " más" : "") + "</p></article>").join("");

$("#foot").textContent = "Instantánea del " + DATA.sitio.generado +
  ", leída directamente de tu base de datos. No se actualiza sola: pídeme que la regenere y se refresca en esta misma dirección.";
</script>
